name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend:
    name: Backend (Flask / Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: src/backend/requirements.txt

      - name: Instalar dependências do Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validação de sintaxe Python
        run: |
          python -m py_compile app.py

      - name: Testar execução do Backend (Flask)
        run: |
          python app.py &
          sleep 3
          curl --fail http://localhost:5000/api/hello

  frontend:
    name: Frontend (React / Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do Frontend
        run: |
          npm install

      - name: Validar build do Frontend (React)
        run: |
          npm run build

