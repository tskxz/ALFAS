name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend:
    name: Backend (Flask / Python)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: alfas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: alfas_test
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: src/backend/requirements.txt

      - name: Instalar dependências do Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validação de sintaxe Python
        run: |
          python -m py_compile app.py

      - name: Testar execução do Backend (Flask)
        run: |
          python app.py &
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://localhost:5000/api/hello

  frontend:
    name: Frontend (React / Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do Frontend
        run: |
          npm install

      - name: Validar build do Frontend (React)
        run: |
          npm run build

