name: Validar Aprovacao de Pull Request

on:
  pull_request:
    branches:
      - master
      - main
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, edited, dismissed]

jobs:
  verificar-aprovacao:
    name: Verificar Aprovacao de Reviewer
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validar se existe pelo menos um reviewer com aprovacao
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Mapear apenas a revisao mais recente de cada utilizador
            const latestReviews = new Map();
            for (const r of reviews.data) {
              latestReviews.set(r.user.login, r.state);
            }

            // Filtrar revisores que aprovaram e que nao sao o proprio autor do PR
            const approvals = Array.from(latestReviews.entries()).filter(
              ([login, state]) => state === 'APPROVED' && login !== context.payload.pull_request.user.login
            );

            if (approvals.length === 0) {
              core.setFailed('Bloqueio de merge: Este Pull Request necessita de pelo menos uma aprovacao (APPROVED) de um revisor.');
            } else {
              core.info(`Aprovacao confirmada pelo(s) revisor(es): ${approvals.map(([login]) => login).join(', ')}`);
            }
